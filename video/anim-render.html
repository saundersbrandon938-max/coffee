<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<title>A Little Coffee. A Brighter Day. — render</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,650;12..96,750&family=Source+Sans+3:wght@400;600;700&family=Caveat:wght@400;700&display=block" rel="stylesheet">
<style>html,body{margin:0;background:#141210;overflow:hidden}
 #bmc-story{position:static}#bmc-story .bmc-stage{width:1280px;height:720px}
 #bmc-canvas{width:1280px !important;height:720px !important;max-width:none !important;max-height:none !important;box-shadow:none !important}
 #bmc-story .bmc-skip,#bmc-story .bmc-controls,#bmc-story .bmc-splash,#bmc-launch{display:none !important}
 #dl{position:fixed;left:12px;bottom:12px;z-index:10;background:#a9462d;color:#fff;border:0;border-radius:999px;padding:10px 16px;font-family:"Source Sans 3",sans-serif;font-weight:700;cursor:pointer}
</style></head>
<body>
<script>window.BMC_NO_AUTOPLAY=true;</script>
<div id="bmc-story"><div class="bmc-stage">
  <canvas id="bmc-canvas" width="1280" height="720"></canvas>
  <button class="bmc-skip" id="bmc-skip">s</button>
  <div class="bmc-controls" id="bmc-controls" hidden><button id="bmc-play"><svg id="bmc-playicon" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg></button><input class="bmc-scrub" id="bmc-scrub" type="range" min="0" max="1000" value="0"><span class="bmc-time" id="bmc-time">0:00 / 0:20</span><button id="bmc-sound"><svg id="bmc-soundicon" viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9H4z"/></svg></button></div>
  <div class="bmc-splash" id="bmc-splash"><div class="ttl"></div><div class="bar"><i id="bmc-splashbar"></i></div><small id="bmc-splashmsg"></small></div>
</div></div>
<button id="bmc-launch"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><span>s</span></button>
<button id="dl">Download video</button>

<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="../js/story/engine.js"></script>
<script src="../js/story/sound.js"></script>
<script src="../js/story/scenes.js"></script>
<script src="../js/story/live.js"></script>
<script src="../js/story/player.js"></script>
<script>
(function(){
const FPS=30;
async function render(){
  await document.fonts.ready.catch(()=>{});
  await new Promise(res=>window.BMC_build(res));
  const canvas=document.getElementById('bmc-canvas');
  const DUR=window.DURATION||20, N=Math.round(DUR*FPS);
  if(!window.VideoEncoder||!window.Mp4Muxer)throw new Error('WebCodecs/Mp4Muxer unavailable');
  const {Muxer,ArrayBufferTarget}=window.Mp4Muxer;
  const target=new ArrayBufferTarget();
  const muxer=new Muxer({target,fastStart:'in-memory',video:{codec:'avc',width:1280,height:720,frameRate:FPS},audio:{codec:'aac',numberOfChannels:2,sampleRate:48000}});
  const venc=new VideoEncoder({output:(c,m)=>muxer.addVideoChunk(c,m),error:e=>console.error('venc',e)});
  venc.configure({codec:'avc1.42001f',width:1280,height:720,bitrate:9000000,framerate:FPS,latencyMode:'quality'});
  for(let i=0;i<N;i++){window.seek(i/FPS);const frame=new VideoFrame(canvas,{timestamp:Math.round(i/FPS*1e6),duration:Math.round(1e6/FPS)});venc.encode(frame,{keyFrame:i%60===0});frame.close();if(venc.encodeQueueSize>8)await new Promise(r=>setTimeout(r,0));if(i%30===0)console.log('frame',i,'/',N);}
  await venc.flush();
  try{const au=await window.SOUND.renderOffline(window.scoreSound,DUR,48000,{});const aenc=new AudioEncoder({output:(c,m)=>muxer.addAudioChunk(c,m),error:e=>console.error('aenc',e)});aenc.configure({codec:'mp4a.40.2',sampleRate:48000,numberOfChannels:2,bitrate:160000});const total=au.frames,CH=2048;let off=0;while(off<total){const n=Math.min(CH,total-off);const buf=new Float32Array(n*2);buf.set(au.inter.subarray(off*2,off*2+n*2));const ad=new AudioData({format:'f32',sampleRate:48000,numberOfFrames:n,numberOfChannels:2,timestamp:Math.round(off/48000*1e6),data:buf});aenc.encode(ad);ad.close();off+=n;if(aenc.encodeQueueSize>8)await new Promise(r=>setTimeout(r,0));}await aenc.flush();}catch(e){console.warn('audio skipped',e);}
  muxer.finalize();const bytes=new Uint8Array(target.buffer);window.__lastBytes=bytes;return {bytes:bytes.length,frames:N,fps:FPS};
}
window.__render=render;
document.getElementById('dl').addEventListener('click',async()=>{const dl=document.getElementById('dl');dl.textContent='Rendering…';await render();const blob=new Blob([window.__lastBytes],{type:'video/mp4'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='animation.mp4';a.click();dl.textContent='Download video';});
window.__ready=true;
})();
</script>
</body></html>
